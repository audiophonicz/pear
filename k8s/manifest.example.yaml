# Example K3s manifest for PEAR. Adjust image, ingress host/class, and TLS
# secret/issuer references to match your cluster before applying.
# PEAR is stateless (all session/server data lives in browser localStorage),
# so no PersistentVolumeClaim is needed.
apiVersion: v1
kind: Namespace
metadata:
  name: pearplex-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pear
  namespace: pearplex-ns
  labels:
    app: pear
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pear
  template:
    metadata:
      labels:
        app: pear
    spec:
      containers:
        - name: pear
          image: ghcr.io/audiophonicz/pear:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pear
  namespace: pearplex-ns
spec:
  selector:
    app: pear
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pear
  namespace: pearplex-ns
  annotations:
    # e.g. cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: pear.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pear
                port:
                  number: 80
  # tls:
  #   - hosts: ["pear.example.internal"]
  #     secretName: pear-tls
