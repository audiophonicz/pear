# PEAR TOOL - Plex Entity AddedAt Relocator
#
# Visual tool to remove items from the Recently Added lists
#
# https://github.com/audiophonicz/pear

#cat <<"EOF" | kubectl apply -f -
#pear-namespace.yml
apiVersion: v1
kind: Namespace
metadata:
  name: pear-namespace
---
#pear-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: pear
  name: pear
  namespace: pear-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pear
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pear
    spec:
      automountServiceAccountToken: true
      containers:
      - name: pear
        image: ghcr.io/audiophonicz/pear:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          httpGet:
            path: /
            port: 80
        ports:
        - containerPort: 80
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          httpGet:
            path: /
            port: 80
        resources: {}
        startupProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          httpGet:
            path: /
            port: 80
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      hostname: pear
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
#pear-svc.yml
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: pear
  name: pear-svc
  namespace: pear-namespace
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/name: pear
  sessionAffinity: None
  type: ClusterIP
---
#pear-redirect_httproute.yml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pear-redirect
  namespace: pear-namespace
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-system
    sectionName: web          # Only attach to HTTP listener

  hostnames:
  - "pear.k3s.example.com"

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
#pear-route_httproute.yml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pear-route
  namespace: pear-namespace
  labels:
    app.kubernetes.io/name: pear
    app.kubernetes.io/instance: pear
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-system
    sectionName: websecure     # Only attach to HTTPS listener

  hostnames:
  - "pear.k3s.example.com"

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pear-svc
      port: 80
# EOF

