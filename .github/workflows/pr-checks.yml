name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  sonarcloud:
    name: SonarCloud Scan
    needs: [lint-format, type-check]
    runs-on: ubuntu-latest
    # Fork PRs and Dependabot PRs both don't get repo Actions secrets (Dependabot
    # has its own separate secret store), so SONAR_TOKEN is unavailable and this
    # job would just fail with an auth error -- skip it entirely for both instead
    # of showing a check nobody can fix. A job skipped via `if:` reports as
    # "Success" for required-status-check purposes, so this doesn't block merging.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test
      - uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
