name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'k8s/**'
  workflow_dispatch:

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  sonarcloud:
    name: SonarCloud Scan
    needs: [lint-format, type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build & Push Docker Image
    needs: [lint-format, type-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Auto-incrementing patch version: major.minor comes from package.json,
      # patch is (highest existing vX.Y.* tag on the GHCR package) + 1. Falls
      # back to patch 0 if the package has no matching tags yet (first run) or
      # the lookup fails for any reason, rather than failing the build over it.
      - name: Compute image version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          LATEST_PATCH=$(gh api "/users/audiophonicz/packages/container/pear/versions" --paginate 2>/dev/null \
            | node -e "
                let data = '';
                process.stdin.on('data', d => data += d);
                process.stdin.on('end', () => {
                  try {
                    const versions = JSON.parse(data);
                    const tags = versions.flatMap(v => v.metadata?.container?.tags ?? []);
                    const patches = tags
                      .filter(t => t.startsWith('v${BASE}.'))
                      .map(t => parseInt(t.split('.').pop(), 10))
                      .filter(n => !isNaN(n));
                    console.log(patches.length ? Math.max(...patches) : -1);
                  } catch { console.log(-1); }
                });
              ")
          NEXT_PATCH=$(( ${LATEST_PATCH:--1} + 1 ))
          VERSION="v${BASE}.${NEXT_PATCH}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: scan-target:latest

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:latest
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://scan-target:latest
          only-severities: critical,high
          exit-code: true
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKER_SCOUT_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/audiophonicz/pear:latest
            ghcr.io/audiophonicz/pear:main
            ghcr.io/audiophonicz/pear:${{ steps.version.outputs.version }}
            ghcr.io/audiophonicz/pear:${{ steps.version.outputs.short_sha }}
