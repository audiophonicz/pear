# Defaults matching SonarCloud's standard GitHub-import naming
# (org key = lowercase GitHub username, project key = <owner>_<repo>).
# Verify these against the actual project once created at sonarcloud.io and
# adjust if they don't match.
sonar.projectKey=audiophonicz_pear
sonar.organization=audiophonicz
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
